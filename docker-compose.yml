version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: 2pc-postgres
    environment:
      POSTGRES_DB: two_phase_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    command: postgres -c max_prepared_transactions=100
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7.0
    container_name: 2pc-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"

  mongo-init:
    image: mongo:7.0
    depends_on:
      - mongo
    restart: "no"
    command: >
      bash -c "sleep 3 && mongosh --host mongo:27017 --eval 'try { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}) } catch(e) { rs.status() }'"